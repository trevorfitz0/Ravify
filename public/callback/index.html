<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/site.css">
<title>ravify — signing in</title>
</head>
<body>
<div class="wrap"><main class="hero"><p class="kicker">Spotify</p><h1>Fetching your top artists…</h1></main></div>
<script src="/js/config.js"></script>
<script src="/js/import.js"></script>
<script>
// Spotify sends people back here after sign-in. Collect their top artists, hand them to the builder, go home.
(async function () {
  const q = new URLSearchParams(location.search);
  let out;
  try {
    if (!q.get('code')) throw new Error(q.get('error') ? 'Spotify sign-in was cancelled.' : 'Nothing to import.');
    out = { artists: await RV.spotifyFinish(q.get('code')) };
    if (!out.artists.length) out = { error: 'Spotify has no top artists for this account yet.' };
  } catch (e) {
    out = { error: e.message };
  }
  try { localStorage.setItem('rv-import', JSON.stringify(out)); } catch (e) {}
  location.replace('/#make');
})();
</script>
</body>
</html>
